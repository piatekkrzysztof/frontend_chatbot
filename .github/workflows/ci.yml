name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Build i testy nie odpytuja prawdziwego backendu; wartosc musi tylko istniec
  NEXT_PUBLIC_API_URL: http://localhost:8000/api

jobs:
  jakosc:
    name: Lint, typy i build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Instalacja zaleznosci
        run: npm ci

      - name: Lint
        run: npm run lint

      # Build Next.js nie sprawdza typow w kazdej konfiguracji, wiec pytamy
      # o nie wprost -- inaczej blad typu wychodzi dopiero na produkcji.
      - name: Typy
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  testy:
    name: Testy jednostkowe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Instalacja zaleznosci
        run: npm ci

      - name: Vitest
        run: npm test

  e2e:
    name: Testy w przegladarce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Instalacja zaleznosci
        run: npm ci

      # Playwright uzywa Chrome'a z systemu (channel: 'chrome'), a obrazy
      # ubuntu-latest maja go preinstalowanego -- stad brak `playwright
      # install`, ktory sciagalby ~300 MB przy kazdym uruchomieniu.
      - name: Playwright
        run: npm run test:e2e

      - name: Slady po nieudanych testach
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-slady
          path: |
            test-results/
            playwright-report/
          retention-days: 7
