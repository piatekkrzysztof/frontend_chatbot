name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Build nie odpytuje backendu; wartość musi tylko istnieć
      NEXT_PUBLIC_API_URL: http://localhost:8000/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
